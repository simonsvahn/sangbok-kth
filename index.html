<!doctype html><html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sångbok KTH</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2e5339">
<style>
:root{--rod:#8b2e2e;--gron:#2e5339;--papper:#faf6ee;--blek:#8a8378}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Iowan Old Style,Palatino,Georgia,serif;background:var(--papper);color:#2b2620;display:flex;height:100vh;height:100dvh}
/* Listan är en kolumn: filterhuvudet står stilla, bara #poster scrollar — så syns
   sök och filter hela tiden medan man bläddrar bland låtarna. */
#lista{width:340px;min-width:260px;display:flex;flex-direction:column;border-right:2px solid var(--gron);background:#f3edE1}
#listhuvud{flex:none;padding:10px 10px 4px}
#poster{flex:1;overflow-y:auto;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
#vy{flex:1;overflow-y:auto;padding:24px 32px}
/* Fällbar meny: knappen ligger fast i hörnet och togglar body.dold */
body.dold #lista{display:none}
body.dold #vy{padding-left:56px}
#menyknapp{position:fixed;top:8px;left:8px;z-index:20;width:34px;height:31px;padding:0;
 font:inherit;font-size:1.05em;line-height:1;background:#fff;color:var(--gron);
 border:1px solid var(--gron);border-radius:8px;cursor:pointer}
#menyknapp:hover{background:var(--gron);color:#fff}
h1{font-size:1.3em;color:var(--gron);margin:4px 0 10px;padding-left:38px}
h1 .underrubrik{font-size:.68em;font-weight:normal;color:var(--blek)}
#sok,#bokval,#kapval{width:100%;padding:7px;font:inherit;border:1px solid var(--blek);border-radius:6px;background:#fff}
#bokval{margin-bottom:6px}
#kapval{margin-bottom:6px;display:none;border-color:var(--gron);color:var(--gron)}
#melval{width:100%;padding:7px;font:inherit;border:1px solid var(--gron);border-radius:6px;background:#fff;margin-bottom:6px;color:var(--gron)}
.post{padding:5px 7px;border-radius:6px;cursor:pointer;font-size:.95em}
.post:hover{background:#e8e0cf}.post.vald{background:var(--gron);color:#fff}
.post small{color:var(--blek)}.post.vald small{color:#d8e2d8}
.lack{color:var(--rod);font-weight:bold}.post.vald .lack{color:#fff}
#ackfilter{display:block;font-size:.85em;color:var(--blek);margin:6px 2px 4px;cursor:pointer}
#ackfilter input{accent-color:var(--rod);vertical-align:-2px;margin-right:4px}
#omrval{display:flex;gap:4px;margin-bottom:6px}
.omrknapp{flex:1;text-align:center;padding:5px 4px;border:1px solid var(--gron);border-radius:8px;cursor:pointer;font-size:.82em;color:var(--gron)}
.omrknapp.vald{background:var(--gron);color:#fff}
#hogtid{width:100%;padding:7px;font:inherit;border:1px solid var(--blek);border-radius:6px;background:#fff;margin-bottom:6px}
.tagg{display:inline-block;background:#e8e0cf;border-radius:9px;padding:1px 9px;font-size:.75em;margin:0 4px 4px 0;color:#5a5344}
.songtitel{color:var(--rod);font-size:1.6em;margin:0 0 2px}
.metadata{color:var(--blek);font-size:.9em;margin-bottom:14px}
.flik{display:inline-block;padding:4px 12px;margin:0 6px 6px 0;border:1px solid var(--gron);border-radius:14px;cursor:pointer;font-size:.85em}
.flik.vald{background:var(--gron);color:#fff}
.flikack{border-color:var(--rod);color:var(--rod)}
.flikack.vald{background:var(--rod);color:#fff}
pre{white-space:pre-wrap;font:inherit;background:#fff;border:1px solid #e0d8c6;border-radius:8px;padding:16px 20px;max-width:46em}
.badge{display:inline-block;background:var(--rod);color:#fff;border-radius:9px;padding:1px 8px;font-size:.75em;margin-left:6px}
.badge.harkomst{background:transparent;color:var(--blek);border:1px solid var(--blek)}
.dampat{color:var(--blek);font-size:.9em}
.diffins{background:#d3ecd3}.diffdel{background:#f3cfcf;text-decoration:line-through}
label{font-size:.85em;color:var(--blek)}.varnot{background:#fdf3d7;border:1px solid #e8d189;border-radius:8px;padding:8px 12px;font-size:.85em;max-width:46em;margin-bottom:10px}
.chosek{background:#fff;border:1px solid #e0d8c6;border-radius:8px;padding:14px 18px;max-width:46em;margin-bottom:10px}
.chosek.chorus{border-left:4px solid var(--gron)}
.chosek.tab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82em;white-space:pre;overflow-x:auto}
.chosek.comment,.chokom{font-style:italic;color:var(--blek)}
.chorad{white-space:pre-wrap;margin:0}
.seg{display:inline-block;vertical-align:bottom}
.seg .ack{display:block;font-weight:bold;color:var(--rod);font-size:.8em;line-height:1.15}
#skal{position:fixed;inset:0;background:var(--papper);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
#skal[hidden]{display:none}
#skal .ruta{max-width:26em;background:#fff;border:1px solid #e0d8c6;border-radius:12px;padding:26px 30px;text-align:center}
#skal button{font:inherit;background:var(--gron);color:#fff;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;margin-top:12px}
#skal .fel{color:var(--rod);font-size:.9em}
/* ---- Mobil: listan täcker skärmen, sången visas när man valt en (JS fäller
   automatiskt bort menyn vid val). Samma ☰-knapp tar tillbaka listan. ---- */
@media(max-width:720px){
 body{font-size:17px}
 #lista{position:fixed;inset:0;width:auto;min-width:0;border-right:0;z-index:10}
 /* Filterhuvudet ska stjäla så lite höjd som möjligt — rubriken ligger bredvid
    ☰-knappen och de fyra rullistorna i två kolumner. Gav 440px → ~270px huvud,
    dvs nästan 200px mer synlig låtlista på en 812px-skärm. */
 #listhuvud{padding:9px 12px 4px}
 #filter{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
 #filter select{margin-bottom:0;min-width:0}
 #poster{padding:0 12px 18px}
 .post{padding:9px 8px;font-size:1em}            /* större träffytor för fingret */
 #vy{padding:48px 15px 30px}
 body.dold #vy{padding-left:15px}
 #menyknapp{width:38px;height:34px;font-size:1.15em}
 h1{padding-left:44px;font-size:1.1em;margin:0 0 7px;line-height:1.25}
 h1 .underrubrik{font-size:.75em}
 #omrval{margin-bottom:6px}
 .omrknapp{padding:7px 4px}
 #ackfilter{margin:5px 2px 3px}
 #sok,#bokval,#kapval,#melval,#hogtid{padding:9px;font-size:16px}  /* 16px = ingen inzoomning i iOS */
 pre,.varnot,.chosek{max-width:none}
 pre{padding:13px 15px}
 .songtitel{font-size:1.35em}
 .flik{padding:6px 13px}
}
</style></head><body>
<button id="menyknapp" type="button" title="Visa eller dölj låtlistan" aria-label="Visa eller dölj låtlistan" aria-expanded="true">☰</button>
<div id="lista"><div id="listhuvud"><h1>Sångbok KTH<br><span class="underrubrik">KTH Maskin 1961–2013 &amp; klassiker · <span id="antal">…</span> visor</span></h1>
<div id="omrval"><span class="omrknapp vald" data-omr="alla">Alla</span><span class="omrknapp" data-omr="kth">KTH Maskin</span><span class="omrknapp" data-omr="ovr">Övriga</span></div>
<div id="filter"><select id="bokval"><option value="">Alla böcker</option><option value="1961">1961</option><option value="1975">1975</option><option value="1981">1981</option><option value="1985">1985</option><option value="1988">1988</option><option value="1991">1991</option><option value="1994">1994</option><option value="1995">1995</option><option value="2000">2000</option><option value="2004">2004</option><option value="2007">2007</option><option value="2010">2010</option><option value="2013">2013</option><option value="Phul 1991">Phul 1991</option></select>
<select id="kapval"><option value="">Alla kapitel</option></select>
<select id="melval"><option value="">Alla melodier</option></select>
<select id="hogtid"><option value="">Alla högtider &amp; teman</option><option>Midsommar</option><option>Kräftskiva</option><option>Jul</option><option>Allmänt</option><option>Klassiker</option></select></div>
<input id="sok" placeholder="Sök titel eller text…">
<label id="ackfilter"><input type="checkbox" id="bararack">endast med ackord ♪</label></div>
<div id="poster"></div></div>
<div id="vy"><p>Välj en sång i listan.</p></div>
<script>
let S=null,CHO=null,KAP={},MELODIER=[];
const poster=document.getElementById('poster'),vy=document.getElementById('vy'),sok=document.getElementById('sok'),bokval=document.getElementById('bokval'),kapval=document.getElementById('kapval'),melval=document.getElementById('melval'),bararack=document.getElementById('bararack'),hogtid=document.getElementById('hogtid');
// melodirullistan: melodier med ≥2 visor, störst först (böjningsvarianter hopslagna)
// funktion (inte engångskod) — webbskalet startar med tom lista och fyller den
// när payloaden hämtats ur Dropbox
function fyllMelodier(){melval.innerHTML='<option value="">Alla melodier ('+MELODIER.length+')</option>'
 +MELODIER.map((m,i)=>'<option value="'+i+'">'+m[0]+'</option>').join('');}
fyllMelodier();
let melVarianter=[];
function valjMelodi(){melVarianter=melval.value===''?[]:(MELODIER[+melval.value]||['',[]])[1]}
const harMelodi=(s,varianter)=>varianter.some(x=>s.mel.indexOf(x)>=0||s.v.some(v=>v.mel===x));
let vald=-1,omr='alla';
// Fällbar meny. På mobil (≤720px) ligger listan över hela skärmen; att välja en
// sång fäller bort den automatiskt. På desktop ger knappen sången hela bredden.
const menyknapp=document.getElementById('menyknapp');
const arMobil=()=>matchMedia('(max-width:720px)').matches;
function satMeny(oppen){document.body.classList.toggle('dold',!oppen);
 menyknapp.setAttribute('aria-expanded',oppen?'true':'false');
 // fokus i sökrutan bara på desktop — på mobil skulle tangentbordet fara upp
 // varje gång man tar fram listan
 if(oppen&&!arMobil())sok.focus({preventScroll:true})}
menyknapp.onclick=()=>satMeny(document.body.classList.contains('dold'));
// Kapitelrullistan: vald bok → bokens egna kapitel i bokens ordning.
// Ingen bok vald → tvärgående kapiteltyper (bokens olika stavningar hopslagna),
// så "Visor till nubben" ger nubbevisorna ur alla fjorton böcker.
let kapVarianter=[],kapPoster=[];
function fyllKapitel(){const bok=bokval.value;
 // vald bok: bokens EGNA kapitelnamn i bokens ordning. Ingen bok: de kanoniska
 // kapiteltyperna (bokens stavningsvarianter hopslagna), störst först.
 kapPoster=bok?(KAP[bok]||[]).map(k=>[k,[k]]):(KAP.__ALLA__||[]);
 kapval.innerHTML='<option value="">'+(bok?'Alla kapitel':'Alla kapiteltyper')
  +(kapPoster.length?' ('+kapPoster.length+')':'')+'</option>'
  +kapPoster.map((p,i)=>'<option value="'+i+'">'+p[0]+'</option>').join('');
 kapval.style.display=(omr==='ovr'||!kapPoster.length)?'none':'block';
 kapval.value='';kapVarianter=[];}
function valjKapitel(){kapVarianter=kapval.value===''?[]:(kapPoster[+kapval.value]||['',[]])[1];}
document.querySelectorAll('.omrknapp').forEach(k=>k.onclick=()=>{omr=k.dataset.omr;
 document.querySelectorAll('.omrknapp').forEach(x=>x.classList.toggle('vald',x===k));
 bokval.style.display=(omr==='ovr')?'none':'block';if(omr==='ovr')bokval.value='';
 // högtidsfiltret hör till Övriga/Alla — i KTH-läget räcker bok + kapitel
 hogtid.style.display=(omr==='kth')?'none':'block';if(omr==='kth')hogtid.value='';
 fyllKapitel();rita(sok.value)});
function rita(filter){poster.innerHTML='';const bok=bokval.value,ht=hogtid.value;
 // bokstavsordning i vyn — posternas index i S röres inte (titelrättade poster ligger osorterat i arrayen)
 const ordning=S.map((_,i)=>i).sort((a,b)=>S[a].t.localeCompare(S[b].t,'sv'));
 ordning.forEach(i=>{const s=S[i];
 if(omr!=='alla'&&s.omr!==omr)return;
 if(ht&&!(s.taggar&&s.taggar.includes(ht)))return;
 if(bok&&!s.v.some(v=>v.bok===bok))return;
 if(kapVarianter.length&&!s.v.some(v=>(!bok||v.bok===bok)&&kapVarianter.indexOf(v.kapitel||'(utan kapitel)')>=0))return;
 if(melVarianter.length&&!harMelodi(s,melVarianter))return;
 if(bararack.checked&&!s.cho)return;
 if(filter){const f=filter.toLowerCase();
  // söker titel, alternativa titlar, MELODI (sång- och versionsnivå) och verstext
  if(!(s.t.toLowerCase().includes(f)||s.alt.some(a=>a.toLowerCase().includes(f))
     ||s.mel.some(m=>m.toLowerCase().includes(f))||s.v.some(v=>(v.mel||'').toLowerCase().includes(f))
     ||s.v.some(v=>v.text.toLowerCase().includes(f))))return;}
 const d=document.createElement('div');d.className='post'+(i===vald?' vald':'');
 const vb=bok?(s.v.find(v=>v.bok===bok)||{}):null;
 const info=s.omr==='ovr'?(s.taggar[0]||'Övriga'):(bok?(vb.sida?('s.'+vb.sida):(vb.visa?('nr '+vb.visa):'s.?')):s.n+' '+(s.n>1?'böcker':'bok'));
 d.innerHTML=`${s.t}${s.cho?' <span class="lack">♪</span>':''} <small>· ${info}</small>`;
 d.onclick=()=>{vald=i;visa(i);rita(sok.value);
  // på mobil täcker listan hela skärmen — fäll bort den så sången syns direkt
  if(arMobil())satMeny(false);
  vy.scrollTop=0};poster.appendChild(d)})}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function orddiff(a,b){const wa=a.split(/(\s+)/),wb=b.split(/(\s+)/);
 const m=wa.length,n=wb.length,L=[];for(let i=0;i<=m;i++)L.push(new Int16Array(n+1));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=wa[i]===wb[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let i=0,j=0,ut='';while(i<m&&j<n){if(wa[i]===wb[j]){ut+=esc(wa[i]);i++;j++}
  else if(L[i+1][j]>=L[i][j+1]){ut+='<span class="diffdel">'+esc(wa[i])+'</span>';i++}
  else{ut+='<span class="diffins">'+esc(wb[j])+'</span>';j++}}
 while(i<m){ut+='<span class="diffdel">'+esc(wa[i++])+'</span>'}
 while(j<n){ut+='<span class="diffins">'+esc(wb[j++])+'</span>'}return ut}
function ritaCho(slug){const c=CHO[slug];if(!c)return'<p>(ackordfil saknas)</p>';
 let h='<div class="metadata">';
 if(c.titel)h+=`Verk: ${esc(c.titel)}`;if(c.artist)h+=` · ${esc(c.artist)}`;
 if(c.key)h+=` · Tonart ${esc(c.key)}`;if(c.capo&&c.capo!=='0')h+=` · Capo ${esc(c.capo)}`;
 if(c.kalla)h+=` · <a href="${esc(c.kalla)}" target="_blank" rel="noopener">källa</a>`;
 h+='</div>';
 c.kommentar.forEach(k=>h+=`<div class="chokom">${esc(k)}</div>`);
 c.sek.forEach(sek=>{
  if(sek.typ==='tab'){h+=`<div class="chosek tab">${sek.rader.map(esc).join('\n')}</div>`;return}
  if(sek.typ==='comment'){h+=`<div class="chosek comment">${sek.rader.map(esc).join('<br>')}</div>`;return}
  h+=`<div class="chosek ${sek.typ}">`+sek.rader.map(rad=>
   '<div class="chorad">'+rad.map(([a,t])=>
    `<span class="seg">${a?`<span class="ack">${esc(a)}</span>`:''}<span>${esc(t)}</span></span>`
   ).join('')+'</div>').join('')+'</div>'});
 return h}
function visa(i,ver=0,diffmot=-1){const s=S[i];
 if(s.omr==='ovr'){let h=`<h2 class="songtitel">${esc(s.t)}</h2><div class="metadata">`;
  if(s.mel.length)h+=`Melodi: ${esc(s.mel.join(' · '))}<br>`;
  if(s.upphov.length)h+=`Upphov: ${esc(s.upphov.join(' · '))}<br>`;
  if(s.kalla)h+=`<a href="${esc(s.kalla)}" target="_blank" rel="noopener">källa</a><br>`;h+='</div>';
  h+=(s.taggar||[]).map(t=>`<span class="tagg">${esc(t)}</span>`).join('')+'<br>';
  if(s.cho)h+=`<span class="flik flikack${ver==='ack'?' vald':''}" onclick="visa(${i},'ack')">♪ Ackord</span>`;
  if(ver==='ack'){vy.innerHTML=h+ritaCho(s.cho);vy.scrollTop=0;return}
  h+=`<pre>${esc(s.v[0].text||'(text saknas)')}</pre>`;
  vy.innerHTML=h;vy.scrollTop=0;return}
 if(ver===0&&bokval.value){const k=s.v.findIndex(v=>v.bok===bokval.value);if(k>=0)ver=k;}
 let h=`<h2 class="songtitel">${esc(s.t)}</h2><div class="metadata">`;
 if(s.alt.length)h+=`Även: ${esc(s.alt.join(' · '))}<br>`;
 if(s.mel.length)h+=`Melodi: ${esc(s.mel.join(' · '))}<br>`;
 if(s.upphov.length)h+=`Upphov: ${esc(s.upphov.join(' · '))}<br>`;
 // melodityp/ackordstatus visas bara när de säger något — inte "okand · okand_melodi"
 const TYP={original:'egen melodi',kand_melodi:'sjungs på känd melodi'};
 const bitar=[];
 if(TYP[s.typ])bitar.push(TYP[s.typ]);
 if(!s.cho&&s.ackord==='hittbar_via_melodi')bitar.push('ackord ej hämtade');
 if(bitar.length)h+=`<span class="dampat">${bitar.join(' · ')}</span><br>`;
 h+='</div>';
 s.var.forEach(v=>h+=`<div class="varnot">${esc(v)}</div>`);
 h+=s.v.map((v,k)=>`<span class="flik${k===ver?' vald':''}" onclick="visa(${i},${k},${diffmot})">${v.bok} ${v.sida?('s.'+v.sida):(v.visa?('nr '+v.visa):'s.?')}</span>`).join('');
 if(s.cho)h+=`<span class="flik flikack${ver==='ack'?' vald':''}" onclick="visa(${i},'ack')">♪ Ackord</span>`;
 if(ver==='ack'){vy.innerHTML=h+ritaCho(s.cho);vy.scrollTop=0;return}
 if(s.v.length>1){h+=`<br><label>Jämför med: <select onchange="visa(${i},${ver},this.value)">`+
  `<option value="-1">–</option>`+s.v.map((v,k)=>k===ver?'':`<option value="${k}" ${k==diffmot?'selected':''}>${v.bok}</option>`).join('')+`</select></label>`;}
 const v=s.v[ver];
 // härkomstflaggor (hur uppgiften tagits fram) visas dämpat; äkta varningar rött
 const HARK={HÄRLETT_KAPITEL:'kapitel härlett',SIDA_RÄTTAD:'sida rättad'};
 const hark=v.flaggor.filter(f=>HARK[f]).map(f=>HARK[f]),varn=v.flaggor.filter(f=>!HARK[f]);
 // versionens EGEN melodi (böckerna anger olika) visas vid rätt flik
 const vmel=v.mel&&!s.mel.some(x=>x===v.mel)?v.mel:(v.mel||'');
 h+=`<div class="metadata">${v.kapitel||''}`
   +(vmel?`${v.kapitel?' · ':''}Mel: ${esc(vmel)}`:'')
   +(varn.length?` <span class="badge">${varn.join(', ')}</span>`:'')
   +(hark.length?` <span class="badge harkomst">${hark.join(', ')}</span>`:'')+`</div>`;
 if(diffmot>=0&&diffmot!=ver&&s.v[diffmot])h+=`<pre>${orddiff(s.v[diffmot].text,v.text)}</pre><div class="metadata">Grönt = tillkommit i ${v.bok} jämfört med ${s.v[diffmot].bok}; rött = struket.</div>`;
 else h+=`<pre>${esc(v.text||'(text saknas)')}</pre>`;
 vy.innerHTML=h;vy.scrollTop=0}
sok.oninput=()=>rita(sok.value);bokval.onchange=()=>{fyllKapitel();rita(sok.value)};
kapval.onchange=()=>{valjKapitel();rita(sok.value)};melval.onchange=()=>{valjMelodi();rita(sok.value)};
bararack.onchange=()=>rita(sok.value);hogtid.onchange=()=>rita(sok.value);
if(S){fyllKapitel();rita('')}
// Håll skärmen vaken medan appen är synlig (iOS 16.4+/Chrome; äldre ignorerar tyst)
(function(){if(!('wakeLock' in navigator))return;let lock=null;
async function ta(){try{if(lock||document.visibilityState!=='visible')return;
lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null});}catch(e){}}
document.addEventListener('visibilitychange',ta);window.addEventListener('pointerdown',ta,{passive:true});ta();})();

/* ===== SKALLÄGE — publicerbart, innehåller noll sångtexter =====
   Data bor i Dropbox App Folder och läses efter inloggning (PKCE).
   Mönstret följer Pizzaindex scripts/shell_env.js. */
const APP_KEY='08zh7x71vqpmevs';
// localStorage, INTE sessionStorage: sessionStorage töms när fliken/hemskärmsappen
// stängs, så varje kallstart blev utloggad — och eftersom boot() då föll tillbaka på
// den cachade payloaden UTAN att säga något stod appen frusen på gammal data för
// alltid (upptäckt 2026-07-25: telefonen visade morgonens payload trots ny synk).
const TOKEN_KEY='kthsangbok.tok';
const PKCE_KEY='kthsangbok.pkce';
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function missingCapabilities(){const miss=[];
 if(!window.isSecureContext)miss.push('Sidan körs inte i säker kontext. Använd https eller http://localhost.');
 if(!(window.crypto&&crypto.subtle))miss.push('crypto.subtle saknas, så PKCE går inte att göra.');

const Auth={token:null,

async function dbxJSON(path){
 const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',
  headers:{Authorization:'Bearer '+Auth.token,'Dropbox-API-Arg':JSON.stringify({path})}});
 if(r.status===401){localStorage.removeItem(TOKEN_KEY);Auth.token=null;throw new Error('Sessionen gick ut — logga in igen.')}
 if(!r.ok){const txt=await r.text();
  if(/missing_scope|required scope/i.test(txt))throw new Error('Appen saknar behörigheten files.content.read — kryssa i den under Permissions i Dropbox App Console och logga in igen.');
  if(/not_found/.test(txt))throw new Error('Sångdatan ligger inte i Dropbox-mappen än. Kör <code>scripts/sync_payload.sh</code> på datorn, vänta tills Dropbox synkat klart, och ladda om.');
  throw new Error('Dropbox '+r.status+': '+txt.slice(0,120))}
 return r.json()}

async function boot(){
